# Wspólna konfiguracja. Adres bazy zależy od profilu:
# local  – localhost, odpalanie z IDE trzeba uruchomić recznie kontener dockerowy
# docker – host mysql, ustawia go Compose (SPRING_PROFILES_ACTIVE=docker)
spring:
  application:
    name: items-app
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    username: items
    # Hasło deweloperskie, tylko na potrzeby zadania.
    # W produkcji nie trzymamy go w repozytorium: leży w vaulcie
    # i jest podstawiane przy starcie (zmienna środowiskowa albo Spring Cloud Vault).
    password: items
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      "[hibernate.type.preferred_uuid_jdbc_type]": CHAR
      "[hibernate.hbm2ddl.schema_filter_provider]": pl.com.betacom.itemsapp.infrastructure.adapter.out.persistence.LiquibaseTablesFilterProvider

app:
  security:
    jwt:
      # HMAC, nie para kluczy. Ta aplikacja sama podpisuje token i sama go sprawdza,
      # więc osobny klucz publiczny nic nie rozdziela. Para ma sens, gdy podpisuje jedna
      # usługa, a inne tylko weryfikują i dostają sam klucz publiczny. Do przeglądarki
      # trafia tylko token. Wartość jest deweloperska. W produkcji sekret leży w vaulcie,
      # nie w repozytorium.
      secret: items-app-dev-jwt-secret-32b-min
      expiration-seconds: 3600
    login-rate-limit:
      attempts: 5
      window: 1m
