services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: items
      MYSQL_USER: items
      MYSQL_PASSWORD: items
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uitems", "-pitems"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  items-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql-data: